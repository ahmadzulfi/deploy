# nginx di host, di depan container claudewa.
#
#   sudo cp deploy/nginx/claudewa.conf /etc/nginx/sites-available/claudewa
#   sudo sed -i 's/wa.contoh.go.id/DOMAIN-ANDA/' /etc/nginx/sites-available/claudewa
#   sudo ln -s /etc/nginx/sites-available/claudewa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN-ANDA      # menambah HTTPS + redirect 80->443
#
# Satu domain untuk semuanya: Meta dan Public API ke webhook (:3001),
# selebihnya ke dashboard (:3002).

server {
    listen 80;
    listen [::]:80;
    server_name wa.contoh.go.id;

    # Unggahan template di dashboard (server action dibatasi 8 MB).
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Webhook Meta: /webhooks/whatsapp dan /webhooks/whatsapp/<koneksi>.
    # Tanda tangan diverifikasi dari body mentah, jadi jangan diubah di sini.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_request_buffering off;
    }

    # Public API. POST /api/v1/media menerima dokumen sampai 100 MB.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        client_max_body_size 101m;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
    }

    # Dashboard, termasuk /api/auth dan /api/media milik Next.js.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Uji router dan unduh media dari Meta bisa makan beberapa detik.
        proxy_read_timeout 120s;
    }
}

# Untuk header Connection di atas. Kalau nginx menolak karena sudah
# didefinisikan di nginx.conf, hapus blok ini.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
